version: '3.8'

services:
  woosarr:
    build: .
    container_name: woosarr
    ports:
      - '2000:2000'
    volumes:
      - ./config:/config
    environment:
      - CONFIG_DIR=/config
      - MASTER_KEY=${MASTER_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:2000/api/health']
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
